name: Outage schedule → Telegram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outage-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule and notify
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: GPV3.1
          REGION: kyiv-region
        run: python3 notify.py
      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "outage-bot"
            git config user.email "outage-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: schedule sent [skip ci]"
            git push
          fi
