name: Outage schedule → Telegram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Надіслати графік, навіть якщо він не змінився"
        type: boolean
        default: true
permissions:
  contents: write

concurrency:
  group: outage-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Check schedule and notify
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: GPV3.1
          REGION: kyiv-region
          FORCE: ${{ inputs.force }}
        run: python3 notify.py
      - name: Save state
        if: always()
        run: |
          git add state.json outage.ics
          if ! git diff --cached --quiet; then
            git config user.name  "outage-bot"
            git config user.email "outage-bot@users.noreply.github.com"
            git commit -m "state: update [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Ping healthchecks.io
        # Dead-man's switch: healthchecks.io messages Telegram when the runs stop (cron-job.org or
        # GitHub down) or a run fails. No secret, no ping. Never fails the run itself.
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$HC_PING_URL" ] || exit 0
          url="$HC_PING_URL"
          [ "$JOB_STATUS" = "success" ] || url="$HC_PING_URL/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || true
