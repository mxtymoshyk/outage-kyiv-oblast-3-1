name: Outage schedule → Telegram

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outage-bot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check schedule and notify
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROUP: GPV3.1
          REGION: kyiv-region
        run: python3 notify.py
      - name: Save state
        run: |
          git add state.json outage.ics
          if ! git diff --cached --quiet; then
            git config user.name  "outage-bot"
            git config user.email "outage-bot@users.noreply.github.com"
            git commit -m "state: update [skip ci]"
            git pull --rebase origin main
            git push
          fi
